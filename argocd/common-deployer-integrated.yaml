apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'common01-deployer'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: common01
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://code.europa.eu/api/v4/projects/1402/packages/helm/stable
      targetRevision: ${PROJECT_RELEASE_VERSION}
      helm:
        values: |
          resourcePreset: low
          agentList:
            authorities:
              - authority01
            consumers:
              - consumer01
            providers:
              - dataprovider01
          values:
            branch: develop
          project: default
          namespaceTag: common01
          domainSuffix: integrated.simpl-europe.eu
          argocd:
            appname: common01
            namespace: argocd
          cluster:
            address: https://kubernetes.default.svc
            namespace: common01
            issuer: dev-prod-http
            internalIssuer: dev-selfsigned
            kubeStateHost: kube-prometheus-stack-kube-state-metrics.devsecopstools.svc.cluster.local:8080
          secrets:
            secretEngine: integrated
            role: integrated-role
          kafka:
            ha: true
            topic:
              autocreate: true
      chart: common_components
